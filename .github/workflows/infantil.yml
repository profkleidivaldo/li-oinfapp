name: Atualizar lições infantis

on:
  # Verifica 2 vezes por dia (só faz commit se algo mudou).
  schedule: [{cron: '30 9,21 * * *'}]
  # Roda sozinho quando você envia este arquivo ou os scripts.
  push:
    paths: ['.github/workflows/infantil.yml', 'tools/**']
  # Manual: Actions → Atualizar lições infantis → Run workflow.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: infantil
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Instalar tradutor gratuito (Argos Translate)
        run: pip install argostranslate
        continue-on-error: true
      - name: Instalar leitor de PDF (PyMuPDF)
        run: pip install pymupdf
      - name: Buscar, traduzir e salvar as lições (Beginner, Jardim, Primários)
        timeout-minutes: 120
        env:
          TRADUTOR: argos   # gratuito, roda aqui no GitHub; se falhar, tenta o Google Tradutor gratuito
        run: python tools/gerar_infantil.py auto
      - name: Extrair e traduzir as lições em PDF (Juniores e Teens)
        timeout-minutes: 150
        continue-on-error: true   # se o PDF falhar, as outras lições continuam sendo salvas
        env:
          TRADUTOR: argos
        run: python tools/gerar_pdf.py auto
      - name: Salvar alterações
        if: always()   # salva o progresso mesmo se a etapa anterior parar no meio
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Atualiza lições infantis" && git pull --rebase -q && git push)
